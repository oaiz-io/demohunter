<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-style="{{STYLE}}">
  <div class="ambient-layer" aria-hidden="true"></div>
  <header class="lesson-hero" data-lesson-hero="true">
    <p class="lesson-eyebrow">A DemoHunter visual lesson</p>
    <h1>{{TITLE}}</h1>
    <div class="flow-cue" aria-hidden="true">
      <span>Follow the story</span>
      <i></i>
    </div>
  </header>
  <main class="lesson-flow" data-lesson-flow="true">
    {{SECTIONS}}
  </main>
  <footer class="lesson-end" data-lesson-end="true" aria-label="End of lesson">
    <span>End of lesson</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
