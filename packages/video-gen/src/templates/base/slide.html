<section
  id="slide-{{SLIDE_ID}}"
  class="slide{{ACTIVE_CLASS}}"
  data-slide-id="{{SLIDE_ID}}"
  data-slide-index="{{SLIDE_INDEX}}"
  data-transition="{{TRANSITION}}"
  data-active="{{ACTIVE_FLAG}}"
  aria-hidden="{{ARIA_HIDDEN}}"
>
  <div class="slide-content">
    <h2 data-slide-heading="true">{{HEADING}}</h2>
    <div class="slide-body">
      {{BODY}}
    </div>
  </div>
</section>
