<section
  id="section-{{SECTION_ID}}"
  class="lesson-section"
  data-section-id="{{SECTION_ID}}"
  data-section-index="{{SECTION_INDEX}}"
  data-transition="{{TRANSITION}}"
  data-reveal-state="pending"
  data-current="false"
  aria-labelledby="section-heading-{{SECTION_ID}}"
>
  <div class="section-frame">
    <p class="section-kicker" aria-hidden="true">Chapter {{SECTION_NUMBER}}</p>
    <h2 id="section-heading-{{SECTION_ID}}" data-section-heading="true">{{HEADING}}</h2>
    <div class="section-body" data-section-body="true">
      {{BODY}}
    </div>
  </div>
</section>
