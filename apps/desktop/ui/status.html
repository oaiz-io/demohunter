<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DemoHunter Studio</title>
    <link rel="stylesheet" href="app://ui/shell.css" />
    <style>
      main {
        height: calc(100% - 52px);
        display: grid;
        place-items: center;
        padding-bottom: 52px;
      }
      .card {
        width: 420px;
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--ink);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      pre {
        max-height: 160px;
        width: 100%;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        font: 11px/1.5 "Geist Mono", ui-monospace, monospace;
        color: var(--correction);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        user-select: text;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar"></div>
    <main>
      <div class="card">
        <img src="app://ui/icon.png" alt="" />
        <h1 id="title"></h1>
        <p class="mono" id="detail"></p>
        <div class="bar" id="bar"><i></i></div>
        <pre id="log" hidden></pre>
        <div class="actions" id="actions" hidden>
          <button class="button" id="retry">Try again</button>
          <button class="button ghost" id="other">Open another…</button>
        </div>
      </div>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const error = q.get("error");
      document.getElementById("title").textContent = error
        ? q.get("stopped")
          ? `Studio stopped working in ${q.get("name") ?? "the repository"}`
          : `Could not open ${q.get("name") ?? "the repository"}`
        : q.get("message") ?? `Opening ${q.get("name") ?? "repository"}…`;
      document.getElementById("detail").textContent = q.get("path") ?? "";
      if (error) {
        document.getElementById("bar").hidden = true;
        const log = document.getElementById("log");
        log.hidden = false;
        log.textContent = error;
        log.scrollTop = log.scrollHeight;
        document.getElementById("actions").hidden = false;
        document.getElementById("retry").onclick = () => window.demohunterDesktop.open(q.get("path"));
        document.getElementById("other").onclick = () => window.demohunterDesktop.choose();
      }
    </script>
  </body>
</html>
